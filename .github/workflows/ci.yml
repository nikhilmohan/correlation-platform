name: ci

on:
  pull_request:
  push:
    branches: [main, integration]

# Per-cohort jobs gated by changed paths so each PR runs only the relevant cohort.
# `event-model` changes trigger both Python and Java (it produces both bindings).
# Toolchains are pinned to the repo's local versions: Java 17, Python 3.13, Node 24.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      angular: ${{ steps.filter.outputs.angular }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'services/simulator/**'
              - 'services/trail-builder/**'
              - 'services/codebook-generator/**'
              - 'services/noise-filter/**'
              - 'services/pattern-miner/**'
              - 'libs/event-model/**'
            java:
              - 'services/topology/**'
              - 'services/knowledge/**'
              - 'services/enrichment/**'
              - 'services/pattern-manager/**'
              - 'services/correlation-engine/**'
              - 'services/alarm-manager/**'
              - 'libs/event-model/**'
            angular:
              - 'services/web-ui/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      # The event-model Python binding (acp-event-model) is a real package: install it
      # with its dev extras and run the cohort gate (ruff/black/pytest --cov) against it.
      - name: Lint + test (event-model Python binding)
        run: |
          if [ -f libs/event-model/python/pyproject.toml ]; then
            python -m pip install ./libs/event-model/python[dev]
            python -c "import acp_event_model"   # clean-import check (criterion 18)
            (cd libs/event-model/python && \
              ruff check . && \
              black --check . && \
              pytest --cov --cov-fail-under=80)
          else
            echo "No event-model Python binding yet — skipping."
          fi
      # Python services: lint/test each that has real sources. Until a service lands
      # (pyproject.toml / requirements.txt + tests) this is a no-op.
      - name: Lint + test (Python services)
        run: |
          ran=0
          for d in services/simulator services/trail-builder services/codebook-generator services/noise-filter services/pattern-miner; do
            if [ -f "$d/pyproject.toml" ] || [ -f "$d/requirements.txt" ]; then
              ran=1
              python -m pip install ruff black pytest pytest-cov
              (cd "$d" && ruff check . && black --check . && pytest --cov --cov-fail-under=80)
            fi
          done
          if [ "$ran" = "0" ]; then echo "No Python service sources yet — skipping (scaffold)."; fi

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build (Java cohort)
        run: |
          # The event-model Java binding lives in libs/event-model/java; build it too.
          # The -f gradlew guard makes each entry a no-op until that Gradle project exists,
          # so this loop is safe to land before @java-dev adds the Java binding.
          built=0
          for d in libs/event-model/java services/topology services/knowledge services/enrichment services/pattern-manager services/correlation-engine services/alarm-manager; do
            if [ -f "$d/gradlew" ]; then built=1; (cd "$d" && ./gradlew --no-daemon clean build); fi
          done
          if [ "$built" = "0" ]; then echo "No Gradle project yet — skipping (scaffold)."; fi

  angular:
    needs: changes
    if: needs.changes.outputs.angular == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint + test + build (Angular)
        working-directory: services/web-ui
        run: |
          if [ ! -f package.json ]; then
            echo "No Angular app yet — skipping (scaffold)."
            exit 0
          fi
          npm ci
          npm run lint
          npm test -- --run        # Vitest unit/component tests (TestBed); E2E (Playwright) runs in the integration stage
          npm run build
