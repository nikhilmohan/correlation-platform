name: ci

on:
  pull_request:
  push:
    branches: [main, integration]

# Per-cohort jobs gated by changed paths so each PR runs only the relevant cohort.
# `event-model` changes trigger both Python and Java (it produces both bindings).
# Toolchains are pinned to the repo's local versions: Java 17, Python 3.13, Node 24.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      angular: ${{ steps.filter.outputs.angular }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'services/simulator/**'
              - 'services/trail-builder/**'
              - 'services/codebook-generator/**'
              - 'services/noise-filter/**'
              - 'services/pattern-miner/**'
              - 'libs/event-model/**'
            java:
              - 'services/topology/**'
              - 'services/knowledge/**'
              - 'services/enrichment/**'
              - 'services/pattern-manager/**'
              - 'services/correlation-engine/**'
              - 'libs/event-model/**'
            angular:
              - 'services/web-ui/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Guard: until a service has real sources, there is nothing to lint/test. Once code
      # lands (requirements.txt / pyproject.toml + tests), replace this guard with the real
      # install + checks below.
      - name: Lint + test (Python cohort)
        run: |
          if ! ls services/*/src/*.py >/dev/null 2>&1 && ! ls libs/event-model/src/*.py >/dev/null 2>&1; then
            echo "No Python sources yet — skipping (scaffold)."
            exit 0
          fi
          python -m pip install --upgrade pip ruff black pytest pytest-cov
          ruff check .
          black --check .
          pytest --cov --cov-fail-under=80

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build (Java cohort)
        run: |
          if ! ls services/*/gradlew libs/event-model/gradlew >/dev/null 2>&1; then
            echo "No Gradle project yet — skipping (scaffold)."
            exit 0
          fi
          for d in services/topology services/knowledge services/enrichment services/pattern-manager services/correlation-engine; do
            if [ -f "$d/gradlew" ]; then (cd "$d" && ./gradlew --no-daemon build); fi
          done

  angular:
    needs: changes
    if: needs.changes.outputs.angular == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint + test + build (Angular)
        working-directory: services/web-ui
        run: |
          if [ ! -f package.json ]; then
            echo "No Angular app yet — skipping (scaffold)."
            exit 0
          fi
          npm ci
          npm run lint
          npm test -- --watch=false --browsers=ChromeHeadless
          npm run build
