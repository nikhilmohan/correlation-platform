# Integration environment for the AI/ML Alarm Correlation Platform (Core IP MVP).
#
# Starter scope: infrastructure only — Apache Kafka (KRaft, single broker), NebulaGraph
# (the topology graph: metad + storaged + graphd), and PostgreSQL (topology snapshot metadata +
# the relational stores owned by other services). Per-service app containers, Kafka topic
# creation, and the Spark runtime for pattern-miner are DEFERRED (see the commented block at the
# bottom) and added as each service is built.
#
# Permissive images only: apache/kafka (Apache-2.0), vesoft/nebula-* (Apache-2.0), and
# postgres (PostgreSQL license). Explicitly NOT Confluent, NOT Redpanda, NOT ZooKeeper. No
# Schema Registry — event-model's in-repo JSON Schema is the contract.
#
# Only the Topology Service connects to NebulaGraph (nGQL, abstracted behind its API); no other
# service receives graph credentials or endpoints.

name: correlation-platform

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: cp-kafka
    ports:
      - "9092:9092"      # external listener for host clients
    environment:
      # --- KRaft single-node (broker + controller in one process) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Bind with empty host (all interfaces) — NOT an explicit 0.0.0.0: the apache/kafka:3.9.0
      # entrypoint derives advertised.listeners during the KRaft StorageTool format step and
      # rejects a literal 0.0.0.0 ("advertised.listeners cannot use the nonroutable meta-address").
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Auto-create is OFF: topics are provisioned explicitly by the `kafka-init` one-shot job
      # below (architecture.md "Shared infrastructure conventions"). Services never create topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # Fast TCP readiness check on both listeners. The JVM `kafka-broker-api-versions.sh` tool
    # takes ~6-8s to start and routinely exceeded the 10s healthcheck timeout, leaving the broker
    # stuck "starting" and blocking kafka-init + every `depends_on: kafka healthy` service. `nc`
    # is in the image and is instant; both ports open ⇒ the broker is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 && nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - cp-net

  # One-shot: create the architecture.md topic catalog (auto-create is OFF). Services depend on
  # this completing before they start; they never create topics. Idempotent (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: cp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        B=kafka:29092
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1; }
        for t in topology.changed trails.built codebook.generated knowledge.updated \
                 alarms.history alarms.live alarms.enriched alarms.enriched.live alarms.persisted.live \
                 alarms.status.changed transactions.clean patterns.mined patterns.discovered \
                 patterns.approved correlation.results; do create "$$t" 3; done
        # DLQs (one per consumed topic): single-partition is fine for poison messages
        for t in topology.changed.dlq trails.built.dlq transactions.clean.dlq \
                 alarms.history.dlq alarms.live.dlq alarms.enriched.live.dlq \
                 alarms.persisted.live.dlq alarms.status.changed.dlq correlation.results.dlq; do create "$$t" 1; done
        echo "kafka-init: topic catalog created."
    networks:
      - cp-net

  postgres:
    image: postgres:16
    container_name: cp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: correlation
      POSTGRES_PASSWORD: correlation
      POSTGRES_DB: correlation
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Place *.sql here to bootstrap per-service schemas (topology snapshot metadata, pattern
      # store, incident store, knowledge store, live alarm store) on first start.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U correlation -d correlation"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- NebulaGraph (topology graph) — metad + storaged + graphd. Only the Topology Service
  #     connects (port 9669, nGQL). All three daemons are Apache-2.0 (vesoft/nebula-*). ---
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: cp-nebula-metad
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --data_path=/data/meta
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-metad:19559/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nebula-meta:/data/meta
    networks:
      - cp-net

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: cp-nebula-storaged
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --data_path=/data/storage
    depends_on:
      nebula-metad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-storaged:19779/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nebula-storage:/data/storage
    networks:
      - cp-net

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: cp-nebula-graphd
    ports:
      - "9669:9669"      # nGQL endpoint — Topology Service only
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
    depends_on:
      nebula-metad:
        condition: service_healthy
      # storaged: service_STARTED, not service_healthy. storaged cannot become healthy until it
      # is registered with metad via `ADD HOSTS`, and that registration is issued by the Topology
      # Service THROUGH graphd. Gating graphd on storaged-healthy is therefore circular
      # (graphd↜storaged-healthy↜ADD HOSTS↜topology↜graphd) and deadlocks on clean volumes —
      # graphd only needs metad to serve nGQL; storaged just needs to be up on the network so the
      # bootstrap can register it. Latent because reused volumes carried prior registration.
      nebula-storaged:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-graphd:19669/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- Knowledge Service — authoritative, versioned store for authored domain knowledge.
  #     Owns ONLY the `knowledge` PostgreSQL schema; produces `knowledge.updated`; consumes
  #     nothing. Build context is the repo root (composite build includes libs/event-model). ---
  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    image: acp/knowledge:0.1.0
    container_name: cp-knowledge
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/correlation"
      DB_USER: "correlation"
      DB_PASSWORD: "correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ENABLED: "true"
      KNOWLEDGE_UPDATED_TOPIC: "knowledge.updated"
      SEED_ON_STARTUP: "true"
    ports:
      - "8081:8080"      # /health + /metrics + /openapi.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # JVM Spring Boot context init can take ~100-140s on a busy host; don't flip unhealthy
      # during the legitimate startup window (boots ~10-15s on an idle host).
      start_period: 180s
    networks:
      - cp-net

  # --- Topology Service — sole owner of the NebulaGraph topology graph (nGQL 9669) + the
  #     PostgreSQL topology_meta snapshot metadata. Ingests snapshot files via POST
  #     /topology/snapshots, lifts into NebulaGraph, mints snapshotId, emits topology.changed.
  #     Runs the idempotent ADD HOSTS + CREATE SPACE/TAG/EDGE bootstrap on startup (subsumes the
  #     deferred nebula-init one-shot). All config from env; no hard-coded URLs/credentials. ---
  topology:
    build:
      context: .
      dockerfile: services/topology/Dockerfile
    image: acp/topology:0.1.0
    container_name: cp-topology
    ports:
      - "8082:8080"      # HTTP API + /actuator/health + /actuator/prometheus (8081 = knowledge)
    environment:
      TOPOLOGY_PORT: "8080"
      # Use the INTERNAL listener kafka:29092 (all other services do). kafka:9092 is the PLAINTEXT
      # listener advertised as localhost:9092 (for host-side tooling), so a producer bootstrapped on
      # it connects, is told the broker lives at localhost:9092, and then cannot reach it from inside
      # the container — topology.changed was silently lost (issue #205, P1 chain dead at hop 1).
      TOPOLOGY_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      TOPOLOGY_NEBULA_HOSTS: "nebula-graphd:9669"
      TOPOLOGY_NEBULA_SPACE: "topology"
      TOPOLOGY_NEBULA_USERNAME: "root"
      TOPOLOGY_NEBULA_PASSWORD: "nebula"
      TOPOLOGY_NEBULA_STORAGED_HOST: "nebula-storaged:9779"
      TOPOLOGY_NEBULA_BOOTSTRAP: "true"
      TOPOLOGY_POSTGRES_JDBC_URL: "jdbc:postgresql://postgres:5432/correlation"
      TOPOLOGY_POSTGRES_USERNAME: "correlation"
      TOPOLOGY_POSTGRES_PASSWORD: "correlation"
      TOPOLOGY_KNOWLEDGE_BASE_URL: "http://knowledge:8080"
      TOPOLOGY_KNOWLEDGE_MODE: "real"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nebula-graphd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      # JVM + NebulaGraph bootstrap can take ~90-140s on a busy host; allow the startup window.
      start_period: 180s
    networks:
      - cp-net

  # --- Trail Builder — builds policy-bounded correlation trails. Consumes `topology.changed`
  #     (+ `knowledge.updated` for policy refresh), reads the Topology + Knowledge APIs, persists
  #     trails durably in its own `trailbuilder` PostgreSQL schema, emits `trails.built`, and
  #     serves the trail query API. Reads Topology via API only — never NebulaGraph. ---
  trail-builder:
    build:
      context: .
      dockerfile: services/trail-builder/Dockerfile
    image: acp/trail-builder:0.1.0
    container_name: cp-trail-builder
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+psycopg://correlation:correlation@postgres:5432/correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      TOPOLOGY_SERVICE_BASE_URL: "http://topology:8080"
      TOPOLOGY_SERVICE_MODE: "real"
      KNOWLEDGE_SERVICE_BASE_URL: "http://knowledge:8080"
      KNOWLEDGE_SERVICE_MODE: "real"
      LOG_LEVEL: "INFO"
    ports:
      - "8083:8000"      # trail query API + /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      # Migrate-then-serve startup can be slow on a busy host; allow the startup window.
      start_period: 120s
    networks:
      - cp-net

  # --- Codebook Generator — compiles the forward-propagation codebook. Consumes `trails.built`,
  #     reads Knowledge (propagation templates / fault origins / vocabulary) + Topology query API,
  #     persists the codebook in its own `codebook` PostgreSQL schema, emits `codebook.generated`.
  #     Per the service design, the consumer and the read API run as SEPARATE processes sharing
  #     one image: this `codebook-generator` runs `python -m codebook_generator` (yoyo migrate
  #     then the consumer loop — no HTTP); the `codebook-api` below serves the read API. ---
  codebook-generator:
    build:
      context: .
      dockerfile: services/codebook-generator/Dockerfile
    image: acp/codebook-generator:0.1.0
    container_name: cp-codebook-generator
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment: &codebook-env
      DATABASE_URL: "postgresql+pg8000://correlation:correlation@postgres:5432/correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      # codebook's IntegrationMode enum is UPPERCASE (MOCK|REAL) — distinct from trail-builder's
      # lowercase ServiceMode and the simulator's lowercase Literal; values are per-service.
      KNOWLEDGE_PROPAGATION_TEMPLATES_MODE: "REAL"
      KNOWLEDGE_PROPAGATION_TEMPLATES_URL: "http://knowledge:8080"
      KNOWLEDGE_FAULT_ORIGINS_MODE: "REAL"
      KNOWLEDGE_FAULT_ORIGINS_URL: "http://knowledge:8080"
      KNOWLEDGE_ALARM_TYPE_VOCABULARY_MODE: "REAL"
      KNOWLEDGE_ALARM_TYPE_VOCABULARY_URL: "http://knowledge:8080"
      TOPOLOGY_QUERY_MODE: "REAL"
      TOPOLOGY_QUERY_URL: "http://topology:8080"
      TRAIL_BUILDER_MODE: "REAL"
      TRAIL_BUILDER_URL: "http://trail-builder:8000"
      LOG_LEVEL: "INFO"
    # default CMD = `python -m codebook_generator` (migrate + consumer loop), per the Dockerfile.
    networks:
      - cp-net

  # Codebook read API (same image, the FastAPI app) — serves /codebooks/active + /health + /metrics
  # for the Correlation Engine. Migrations are applied by the consumer service above.
  codebook-api:
    image: acp/codebook-generator:0.1.0
    container_name: cp-codebook-api
    depends_on:
      codebook-generator:
        condition: service_started
    environment: *codebook-env
    command: ["uvicorn", "codebook_generator.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8084:8000"      # codebook read API + /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      # Migrate-then-serve startup can be slow on a busy host; allow the startup window.
      start_period: 120s
    networks:
      - cp-net

  # Simulator — synthetic topology + labeled alarm streams (pure Kafka producer +
  # Topology ingestion API client). Build context is the repo root so the image gets both
  # libs/event-model and the service source. Defaults to a P2 (history) generate run; override
  # PHASE / SIM_MODE / scenario knobs via env. All config is env-sourced (no hard-coded values).
  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    image: acp/simulator:dev
    container_name: cp-simulator
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PHASE: p2
      SIM_MODE: generate
      TOPOLOGY_API_MODE: mock          # switch to "real" + TOPOLOGY_API_BASE_URL for integration
      KNOWLEDGE_MODE: local
      TOPOLOGY_NODE_COUNT: "20"
      SITE_COUNT: "5"
      SCENARIO_INSTANCES: "8"
      NOISE_RATE: "0.2"
      HISTORY_DURATION: "3600"
      SIM_OUTPUT_DIR: /data/sim        # persistent, configurable artifact path (labels+snapshot+corpus)
      HTTP_PORT: "8080"
      LOG_LEVEL: INFO
    command: ["--phase", "p2"]
    volumes:
      - sim-data:/data/sim
    ports:
      - "8085:8080"                    # /health (liveness) + /metrics (Prometheus)
    networks:
      - cp-net

  # --- web-ui — operator/engineer SPA (Angular 20, served by nginx). Static frontend that
  #     calls the collaborating service REST APIs directly (no BFF). Backend wiring is injected
  #     at container start from the *_API_BASE_URL env vars below (window.__ACP_ENV__), so the
  #     one immutable image serves any stack with no rebuild. Host port 8086 (distinct from the
  #     backend services on 8081-8085). Only the P1 read-API services that currently exist in
  #     this compose (topology, trail-builder, codebook-api, knowledge) are wired and depended
  #     on; the P2/P3 service URLs are intentionally left UNSET — the SPA degrades those views
  #     gracefully rather than calling an invented backend. Add their *_API_BASE_URL when
  #     pattern-manager / correlation-engine / alarm-manager / noise-filter land. ---
  web-ui:
    build:
      context: services/web-ui
      dockerfile: Dockerfile
    image: acp/web-ui:0.1.0
    container_name: cp-web-ui
    depends_on:
      topology:
        condition: service_healthy
      trail-builder:
        condition: service_started
      codebook-api:
        condition: service_started
      knowledge:
        condition: service_started
    environment:
      INTEGRATION_MODE: "real"
      # SAME-ORIGIN BASE URLS (CORS fix). These are consumed by the SPA running in the OPERATOR'S
      # BROWSER. They are now SAME-ORIGIN relative path prefixes, NOT cross-origin backend hosts:
      # the browser fetches /api/<svc>/... on the SPA's own origin (:8086), and nginx in this same
      # container reverse-proxies each prefix to the backend BY DOCKER SERVICE NAME on cp-net
      # (see services/web-ui/nginx.conf for the exact prefix→upstream mapping). Because every call
      # is same-origin, the browser never performs a CORS check — eliminating the cross-origin
      # block that previously stopped the SPA from loading data. No backend service is changed.
      TOPOLOGY_API_BASE_URL: "/api/topology"            # → nginx → topology:8080
      TRAIL_BUILDER_API_BASE_URL: "/api/trail-builder"  # → nginx → trail-builder:8000
      CODEBOOK_API_BASE_URL: "/api/codebook"            # → nginx → codebook-api:8000
      KNOWLEDGE_API_BASE_URL: "/api/knowledge"          # → nginx → knowledge:8080
      # P2 services (now in this compose) — same-origin prefixes proxied by nginx BY SERVICE NAME:
      PATTERN_MANAGER_API_BASE_URL: "/api/pattern-manager"  # → nginx → pattern-manager:8080
      NOISE_FILTER_API_BASE_URL: "/api/noise-filter"        # → nginx → noise-filter:8080
      ENRICHMENT_CHATTER_API_BASE_URL: "/api/enrichment"    # → nginx → enrichment:8080
      # P3 services (now in this compose) — same-origin prefixes proxied by nginx BY SERVICE NAME:
      CORRELATION_ENGINE_API_BASE_URL: "/api/correlation-engine"  # → nginx → correlation-engine:8080
      ALARM_MANAGER_API_BASE_URL: "/api/alarm-manager"            # → nginx → alarm-manager:8080
      STREAMING_REFRESH_INTERVAL_MS: "3000"
      DOMAIN: "core-ip"
      SNAPSHOT_ID: "current"
      LOG_LEVEL: "info"
    ports:
      - "8086:8080"      # static SPA (HTTP 200 on / for liveness)
    healthcheck:
      # Use 127.0.0.1, NOT localhost: the nginx image enables IPv6 resolvers, so `localhost`
      # resolves to ::1 where nginx (listening on IPv4 0.0.0.0:8080) isn't bound → false-unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - cp-net

  # ===== P2 cohort ========================================================================
  # The correlation stage: noise-filter → pattern-miner → pattern-manager, plus enrichment.
  # All consume the frozen event-model contract; each owns its schema/state per the invariants.

  # --- Enrichment — source-aware alarm normalization + noise-tagging. Consumes alarms.history /
  #     alarms.live, tags trail context (Trail Builder by-object API) + chatter, emits enriched
  #     streams. Owns NO DB: the per-source ruleset is a MOUNTED, Enrichment-owned YAML validated
  #     against Knowledge's alarmType vocabulary; the writable chatter overlay persists operator
  #     promotions across restarts. ---
  enrichment:
    build:
      context: .
      dockerfile: services/enrichment/Dockerfile
    image: acp/enrichment:0.1.0
    container_name: cp-enrichment
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      trail-builder:
        condition: service_started
      knowledge:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      # Frozen Trail Builder by-object contract on the in-cluster port 8000 (NO /api/v1 prefix).
      TRAIL_BUILDER_BASE_URL: "http://trail-builder:8000"
      TRAIL_BUILDER_MODE: "real"
      TRAIL_BUILDER_MAX_RETRIES: "3"
      TRAIL_BUILDER_RETRY_BACKOFF_MS: "200"
      # Knowledge: authoritative alarmTypeVocabulary fetched at startup (validation only, NOT
      # pipeline params). Degrades to the built-in fallback vocab if Knowledge is unreachable.
      KNOWLEDGE_BASE_URL: "http://knowledge:8080"
      KNOWLEDGE_MODE: "real"
      ENRICHMENT_DOMAIN: "core-ip"
      # Per-source rulesets: mounted, Enrichment-owned config (NOT Knowledge). Hot-reload on.
      ENRICHMENT_RULESETS_FILE: "/config/rulesets.yaml"
      ENRICHMENT_RULESETS_RELOAD: "true"
      # Writable chatter overlay: operator promotions persisted here, durable across restart.
      ENRICHMENT_CHATTER_OVERLAY_FILE: "/config/overlay/chatter-overlay.json"
    volumes:
      # Read-only base rulesets (committed) + a writable named volume for chatter overlay edits.
      - ./services/enrichment/config/rulesets.yaml:/config/rulesets.yaml:ro
      - enrichment-overlay:/config/overlay
    ports:
      - "8088:8080"      # chatter API + /openapi.json + Swagger UI + /actuator/health + /actuator/prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      # JVM Spring Boot context init can take ~100-140s on a busy host; allow the startup window.
      start_period: 180s
    networks:
      - cp-net

  # --- Noise Filter — session-windowing + ML noise classification (scikit-learn). Consumes the
  #     enriched alarm stream, groups into trail-scoped session windows, drops noise, emits
  #     `transactions.clean`. Reads Knowledge (params), Trail Builder + Topology (scope). Owns its
  #     own `noise_filter` state in the shared DB. Thresholds come only from Knowledge. ---
  noise-filter:
    build:
      context: .
      dockerfile: services/noise-filter/Dockerfile
    image: acp/noise-filter:0.1.0
    container_name: cp-noise-filter
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_started
      trail-builder:
        condition: service_started
      topology:
        condition: service_started
    environment:
      HTTP_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      NOISE_FILTER_DB_URL: "postgresql://correlation:correlation@postgres:5432/correlation"
      KNOWLEDGE_SERVICE_URL: "http://knowledge:8080"
      KNOWLEDGE_CLIENT_MODE: "real"
      TRAIL_BUILDER_URL: "http://trail-builder:8000"
      TRAIL_BUILDER_CLIENT_MODE: "real"
      TOPOLOGY_SERVICE_URL: "http://topology:8080"
      TOPOLOGY_CLIENT_MODE: "real"
      # Session-window finalization tuning (event-time watermark + backstop; see design).
      WINDOW_IDLE_GRACE_SECONDS: "90"
      WINDOW_BACKSTOP_SECONDS: "90"
      WINDOW_ALLOWED_LATENESS_BUCKETS: "10"
    ports:
      - "8087:8080"      # /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - cp-net

  # --- Pattern Miner — trail-scoped session windowing + domain-knowledge anchoring + bounded
  #     PrefixSpan (Spark MLlib, container-only). Consumes `transactions.clean`, mines cascade
  #     signatures, emits `patterns.mined` (+ sampleAlarms[] XAI). Reads Knowledge (params, no
  #     hard-coded thresholds) + Codebook (anchoring). Stateless — owns no store. ---
  pattern-miner:
    build:
      context: .
      dockerfile: services/pattern-miner/Dockerfile
    image: acp/pattern-miner:0.1.0
    container_name: cp-pattern-miner
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      knowledge:
        condition: service_started
      codebook-api:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      CONSUMER_GROUP_ID: "pattern-miner-transactions.clean"
      TRANSACTIONS_CLEAN_TOPIC: "transactions.clean"
      PATTERNS_MINED_TOPIC: "patterns.mined"
      DLQ_TOPIC: "transactions.clean.dlq"
      KNOWLEDGE_BASE_URL: "http://knowledge:8080"
      KNOWLEDGE_CLIENT_MODE: "real"
      KNOWLEDGE_DOMAIN: "core-ip"
      KNOWLEDGE_MODEL_PARAMS_RECORD_ID: "core-ip/modelParams/pattern-miner"
      CODEBOOK_BASE_URL: "http://codebook-api:8000"
      CODEBOOK_CLIENT_MODE: "real"
      # Spark/PySpark runtime (container-only). Bounded resources + trail batching keep the driver
      # within a modest container; on a higher-spec host raise SPARK_MASTER parallelism / driver mem
      # via env only (no code change) — these are the OOM-safety knobs.
      MINING_ENGINE: "spark"
      SPARK_MASTER: "local[2]"
      PYSPARK_SUBMIT_ARGS: "--driver-memory 2g pyspark-shell"
      MAX_TRAILS_PER_BATCH: "2"
      BATCH_FLUSH_SECONDS: "60"
      LOG_LEVEL: "INFO"
    ports:
      - "8089:8080"      # /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      # PySpark JVM + first SparkContext init is slow to warm; allow a generous startup window.
      start_period: 180s
    networks:
      - cp-net

  # --- Pattern Manager — sole owner of the Pattern Store + pattern lifecycle. Consumes
  #     `patterns.mined`, runs RCA (Topology API), structural validation, codebook reconciliation
  #     (Codebook API), session-window derivation, signature-fold consolidation + impact metrics,
  #     and computes/persists the readable patternName. Persists DRAFT patterns in its own
  #     `pattern` schema (Flyway) and emits `patterns.discovered`; REST approval promotes
  #     DRAFT→APPROVED (`patterns.approved`). Reads collaborators via their APIs only. ---
  pattern-manager:
    build:
      context: .
      dockerfile: services/pattern-manager/Dockerfile
    image: acp/pattern-manager:0.1.0
    container_name: cp-pattern-manager
    # Explicit alias so the web-ui nginx proxy resolves `pattern-manager` on cp-net.
    networks:
      cp-net:
        aliases:
          - pattern-manager
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_started
      topology:
        condition: service_started
      codebook-api:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/correlation"
      DB_USER: "correlation"
      DB_PASSWORD: "correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ENABLED: "true"
      # Real collaborator wiring (in-compose service names); mock|real is config-switchable.
      INTEGRATION_MODE: "real"
      TOPOLOGY_BASE_URL: "http://topology:8080"
      CODEBOOK_BASE_URL: "http://codebook-api:8000"
      KNOWLEDGE_BASE_URL: "http://knowledge:8080"
    ports:
      - "8090:8080"      # /health + /metrics + /openapi.json + pattern review REST
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      # JVM Spring Boot + Flyway migration on startup; allow the startup window on a busy host.
      start_period: 180s

  # ===== P3 cohort — real-time correlation ================================================
  # Live chain: enrichment → alarms.enriched.live → alarm-manager → alarms.persisted.live →
  # correlation-engine (match/score/RCA vs approved patterns + codebook) → correlation.results
  # → alarm-manager (lifecycle + incident role) → live alarm API → web-ui.

  # --- Alarm Manager — sole owner of LIVE alarm state. Sits in-line on the live path: consumes
  #     alarms.enriched.live, PERSISTS each alarm to its own `live_alarm` schema (Flyway) then
  #     REPUBLISHES on alarms.persisted.live (persist-first = SoT). Maintains lifecycle
  #     (open→correlated→cleared/reverted-open) + root-cause/child role + incident linkage from
  #     correlation.results, syncs status from alarms.status.changed, serves the live alarm query
  #     API to the web-ui. All config from env; consumers idempotent (dedupe on eventId/alarmId). ---
  alarm-manager:
    build:
      context: .
      dockerfile: services/alarm-manager/Dockerfile
    image: acp/alarm-manager:0.1.0
    container_name: cp-alarm-manager
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ALARM_MANAGER_PORT: "8080"
      ALARM_DB_JDBC_URL: "jdbc:postgresql://postgres:5432/correlation"
      # DB user/pass supplied via the standard Spring datasource env (see application.yml).
      SPRING_DATASOURCE_USERNAME: "correlation"
      SPRING_DATASOURCE_PASSWORD: "correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    ports:
      - "8091:8080"      # live alarm query API + /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      # JVM Spring Boot + Flyway migration on startup; allow the startup window on a busy host.
      start_period: 180s
    networks:
      cp-net:
        aliases:
          - alarm-manager

  # --- Correlation Engine — real-time correlation core + system of record for incidents. Consumes
  #     alarms.persisted.live, correlates via lazy per-(trailId,patternId) instances against
  #     APPROVED patterns + the latest codebook, tags root cause, PERSISTS incidents to its own
  #     `incident` schema (Flyway), emits correlation.results + alarms.status.changed, and serves a
  #     read API (/incidents, /stats) for the web-ui Correlation Stats. Reads trailId + sessionWindow
  #     from the Pattern Manager API; match/conflict params from Knowledge model-params (no
  #     hard-coded thresholds). In-memory instance registry + scheduled expiry (MVP, per design #371). ---
  correlation-engine:
    build:
      context: .
      dockerfile: services/correlation-engine/Dockerfile
    image: acp/correlation-engine:0.1.0
    container_name: cp-correlation-engine
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_started
      pattern-manager:
        condition: service_started
      codebook-api:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/correlation"
      SPRING_DATASOURCE_USERNAME: "correlation"
      SPRING_DATASOURCE_PASSWORD: "correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ENABLED: "true"
      INTEGRATION_MODE: "real"
      # Read-API collaborators (in-compose service names). The codebook READ API is codebook-api:8000
      # (codebook-generator is the HTTP-less consumer), so point CE's codebook base URL there.
      PATTERN_MANAGER_BASE_URL: "http://pattern-manager:8080"
      CODEBOOK_GENERATOR_BASE_URL: "http://codebook-api:8000"
      KNOWLEDGE_BASE_URL: "http://knowledge:8080"
      KNOWLEDGE_DOMAIN: "core-ip"
    ports:
      - "8092:8080"      # incident + stats read API + /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      cp-net:
        aliases:
          - correlation-engine

