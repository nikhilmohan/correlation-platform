# Integration environment for the AI/ML Alarm Correlation Platform (Core IP MVP).
#
# Starter scope: infrastructure only — Apache Kafka (KRaft, single broker), NebulaGraph
# (the topology graph: metad + storaged + graphd), and PostgreSQL (topology snapshot metadata +
# the relational stores owned by other services). Per-service app containers, Kafka topic
# creation, and the Spark runtime for pattern-miner are DEFERRED (see the commented block at the
# bottom) and added as each service is built.
#
# Permissive images only: apache/kafka (Apache-2.0), vesoft/nebula-* (Apache-2.0), and
# postgres (PostgreSQL license). Explicitly NOT Confluent, NOT Redpanda, NOT ZooKeeper. No
# Schema Registry — event-model's in-repo JSON Schema is the contract.
#
# Only the Topology Service connects to NebulaGraph (nGQL, abstracted behind its API); no other
# service receives graph credentials or endpoints.

name: correlation-platform

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: cp-kafka
    ports:
      - "9092:9092"      # external listener for host clients
    environment:
      # --- KRaft single-node (broker + controller in one process) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Auto-create is OFF: topics are provisioned explicitly by the `kafka-init` one-shot job
      # below (architecture.md "Shared infrastructure conventions"). Services never create topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - cp-net

  # One-shot: create the architecture.md topic catalog (auto-create is OFF). Services depend on
  # this completing before they start; they never create topics. Idempotent (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: cp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        B=kafka:29092
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1; }
        for t in topology.changed trails.built codebook.generated knowledge.updated \
                 alarms.history alarms.live alarms.enriched alarms.enriched.live alarms.persisted.live \
                 alarms.status.changed transactions.clean patterns.mined patterns.discovered \
                 patterns.approved correlation.results; do create "$$t" 3; done
        # DLQs (one per consumed topic): single-partition is fine for poison messages
        for t in topology.changed.dlq trails.built.dlq transactions.clean.dlq \
                 alarms.history.dlq alarms.live.dlq alarms.enriched.live.dlq \
                 alarms.persisted.live.dlq alarms.status.changed.dlq correlation.results.dlq; do create "$$t" 1; done
        echo "kafka-init: topic catalog created."
    networks:
      - cp-net

  postgres:
    image: postgres:16
    container_name: cp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: correlation
      POSTGRES_PASSWORD: correlation
      POSTGRES_DB: correlation
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Place *.sql here to bootstrap per-service schemas (topology snapshot metadata, pattern
      # store, incident store, knowledge store, live alarm store) on first start.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U correlation -d correlation"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- NebulaGraph (topology graph) — metad + storaged + graphd. Only the Topology Service
  #     connects (port 9669, nGQL). All three daemons are Apache-2.0 (vesoft/nebula-*). ---
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: cp-nebula-metad
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --data_path=/data/meta
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-metad:19559/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nebula-meta:/data/meta
    networks:
      - cp-net

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: cp-nebula-storaged
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --data_path=/data/storage
    depends_on:
      nebula-metad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-storaged:19779/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nebula-storage:/data/storage
    networks:
      - cp-net

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: cp-nebula-graphd
    ports:
      - "9669:9669"      # nGQL endpoint — Topology Service only
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
    depends_on:
      nebula-metad:
        condition: service_healthy
      nebula-storaged:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-graphd:19669/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- Knowledge Service — authoritative, versioned store for authored domain knowledge.
  #     Owns ONLY the `knowledge` PostgreSQL schema; produces `knowledge.updated`; consumes
  #     nothing. Build context is the repo root (composite build includes libs/event-model). ---
  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    image: acp/knowledge:0.1.0
    container_name: cp-knowledge
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/correlation"
      DB_USER: "correlation"
      DB_PASSWORD: "correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ENABLED: "true"
      KNOWLEDGE_UPDATED_TOPIC: "knowledge.updated"
      SEED_ON_STARTUP: "true"
    ports:
      - "8081:8080"      # /health + /metrics + /openapi.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- Topology Service — sole owner of the NebulaGraph topology graph (nGQL 9669) + the
  #     PostgreSQL topology_meta snapshot metadata. Ingests snapshot files via POST
  #     /topology/snapshots, lifts into NebulaGraph, mints snapshotId, emits topology.changed.
  #     Runs the idempotent ADD HOSTS + CREATE SPACE/TAG/EDGE bootstrap on startup (subsumes the
  #     deferred nebula-init one-shot). All config from env; no hard-coded URLs/credentials. ---
  topology:
    build:
      context: .
      dockerfile: services/topology/Dockerfile
    image: acp/topology:0.1.0
    container_name: cp-topology
    ports:
      - "8082:8080"      # HTTP API + /actuator/health + /actuator/prometheus (8081 = knowledge)
    environment:
      TOPOLOGY_PORT: "8080"
      TOPOLOGY_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      TOPOLOGY_NEBULA_HOSTS: "nebula-graphd:9669"
      TOPOLOGY_NEBULA_SPACE: "topology"
      TOPOLOGY_NEBULA_USERNAME: "root"
      TOPOLOGY_NEBULA_PASSWORD: "nebula"
      TOPOLOGY_NEBULA_STORAGED_HOST: "nebula-storaged:9779"
      TOPOLOGY_NEBULA_BOOTSTRAP: "true"
      TOPOLOGY_POSTGRES_JDBC_URL: "jdbc:postgresql://postgres:5432/correlation"
      TOPOLOGY_POSTGRES_USERNAME: "correlation"
      TOPOLOGY_POSTGRES_PASSWORD: "correlation"
      TOPOLOGY_KNOWLEDGE_BASE_URL: "http://knowledge:8080"
      TOPOLOGY_KNOWLEDGE_MODE: "real"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nebula-graphd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- Trail Builder — builds policy-bounded correlation trails. Consumes `topology.changed`
  #     (+ `knowledge.updated` for policy refresh), reads the Topology + Knowledge APIs, persists
  #     trails durably in its own `trailbuilder` PostgreSQL schema, emits `trails.built`, and
  #     serves the trail query API. Reads Topology via API only — never NebulaGraph. ---
  trail-builder:
    build:
      context: .
      dockerfile: services/trail-builder/Dockerfile
    image: acp/trail-builder:0.1.0
    container_name: cp-trail-builder
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+psycopg://correlation:correlation@postgres:5432/correlation"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      TOPOLOGY_SERVICE_BASE_URL: "http://topology:8080"
      TOPOLOGY_SERVICE_MODE: "real"
      KNOWLEDGE_SERVICE_BASE_URL: "http://knowledge:8080"
      KNOWLEDGE_SERVICE_MODE: "real"
      LOG_LEVEL: "INFO"
    ports:
      - "8083:8000"      # trail query API + /health + /metrics
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

# -----------------------------------------------------------------------------------------
# DEFERRED — added as services are built (each needs a real Dockerfile + image):
#
#   simulator, codebook-generator, enrichment,
#   noise-filter, pattern-manager, correlation-engine, web-ui
#
#   (kafka-init is now defined above — the topic catalog is provisioned, auto-create OFF.)
#   Also deferred:
#     - spark: PySpark runtime for pattern-miner (container-only)
#     - prometheus / superset: metrics + dashboards (Apache-2.0)
#     - nebula-init: NO LONGER NEEDED as a separate one-shot — the Topology Service now runs the
#       idempotent `ADD HOSTS "nebula-storaged":9779;` + CREATE SPACE/TAG/EDGE bootstrap itself on
#       startup (see the `topology` service above), so storaged registration is owned by it.
# -----------------------------------------------------------------------------------------

volumes:
  kafka-data:
  pg-data:
  nebula-meta:
  nebula-storage:

networks:
  cp-net:
    driver: bridge
