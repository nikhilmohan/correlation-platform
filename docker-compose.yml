# Integration environment for the AI/ML Alarm Correlation Platform (Core IP MVP).
#
# Starter scope: infrastructure only — Apache Kafka (KRaft, single broker), NebulaGraph
# (the topology graph: metad + storaged + graphd), and PostgreSQL (topology snapshot metadata +
# the relational stores owned by other services). Per-service app containers, Kafka topic
# creation, and the Spark runtime for pattern-miner are DEFERRED (see the commented block at the
# bottom) and added as each service is built.
#
# Permissive images only: apache/kafka (Apache-2.0), vesoft/nebula-* (Apache-2.0), and
# postgres (PostgreSQL license). Explicitly NOT Confluent, NOT Redpanda, NOT ZooKeeper. No
# Schema Registry — event-model's in-repo JSON Schema is the contract.
#
# Only the Topology Service connects to NebulaGraph (nGQL, abstracted behind its API); no other
# service receives graph credentials or endpoints.

name: correlation-platform

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: cp-kafka
    ports:
      - "9092:9092"      # external listener for host clients
    environment:
      # --- KRaft single-node (broker + controller in one process) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Auto-create is convenient for the walking skeleton; topic creation becomes an explicit
      # init job once the topic catalog is enforced.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - cp-net

  postgres:
    image: postgres:16
    container_name: cp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: correlation
      POSTGRES_PASSWORD: correlation
      POSTGRES_DB: correlation
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Place *.sql here to bootstrap per-service schemas (topology snapshot metadata, pattern
      # store, incident store, knowledge store, live alarm store) on first start.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U correlation -d correlation"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- NebulaGraph (topology graph) — metad + storaged + graphd. Only the Topology Service
  #     connects (port 9669, nGQL). All three daemons are Apache-2.0 (vesoft/nebula-*). ---
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: cp-nebula-metad
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --data_path=/data/meta
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-metad:19559/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nebula-meta:/data/meta
    networks:
      - cp-net

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: cp-nebula-storaged
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --data_path=/data/storage
    depends_on:
      nebula-metad:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-storaged:19779/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - nebula-storage:/data/storage
    networks:
      - cp-net

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: cp-nebula-graphd
    ports:
      - "9669:9669"      # nGQL endpoint — Topology Service only
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
    depends_on:
      nebula-metad:
        condition: service_healthy
      nebula-storaged:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://nebula-graphd:19669/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - cp-net

  # --- Pattern Manager — sole owner of the Pattern Store + pattern lifecycle. Consumes
  #     `patterns.mined`, runs RCA (Topology query API), structural validation, codebook
  #     reconciliation (Codebook read API), session-window derivation and explainability, then
  #     persists a DRAFT pattern in its own `pattern` PostgreSQL schema and emits
  #     `patterns.discovered`. Human approval (REST) promotes DRAFT→APPROVED and emits
  #     `patterns.approved`. Reads Topology/Codebook/Knowledge via their published APIs only —
  #     never their stores. Flyway auto-creates the `pattern` schema in the shared `correlation`
  #     DB (same shared-DB / per-service-schema model as knowledge + topology). All config from
  #     env; consumer is idempotent (dedupe on eventId) with a patterns.mined.dlq. ---
  pattern-manager:
    build:
      context: .
      dockerfile: services/pattern-manager/Dockerfile
    image: acp/pattern-manager:0.1.0
    container_name: cp-pattern-manager
    ports:
      - "8090:8080"      # /health + /metrics + /openapi.json (8081-8089 taken by prior services)
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/correlation"
      DB_USER: "correlation"
      DB_PASSWORD: "correlation"
      # Use the INTERNAL listener kafka:29092 (all services do); kafka:9092 advertises
      # localhost:9092 and is unreachable from inside a container.
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ENABLED: "true"
      # Real collaborator wiring (in-compose service names). mock|real is config-switchable.
      INTEGRATION_MODE: "real"
      TOPOLOGY_BASE_URL: "http://topology:8080"
      CODEBOOK_BASE_URL: "http://codebook-api:8000"
      KNOWLEDGE_BASE_URL: "http://knowledge:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_healthy
      topology:
        condition: service_healthy
      codebook-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      # JVM Spring Boot context init can take ~100-140s on a busy host; allow the startup window.
      start_period: 180s
    networks:
      - cp-net

# -----------------------------------------------------------------------------------------
# DEFERRED — added as services are built (each needs a real Dockerfile + image):
#
#   simulator, topology, knowledge, trail-builder, codebook-generator, enrichment,
#   noise-filter, correlation-engine, web-ui
#
#   Also deferred:
#     - kafka-init: one-shot container creating the architecture.md topic catalog
#       (topology.changed, trails.built, codebook.generated, knowledge.updated,
#        alarms.history, alarms.live, alarms.enriched, alarms.enriched.live, alarms.persisted.live,
#        transactions.clean,
#        patterns.mined, patterns.discovered, patterns.approved, correlation.results, *.dlq)
#     - spark: PySpark runtime for pattern-miner (container-only)
#     - prometheus / superset: metrics + dashboards (Apache-2.0)
#     - nebula-init: one-shot container that runs `ADD HOSTS "nebula-storaged":9779;` against
#       nebula-graphd (port 9669) after first boot — NebulaGraph requires storaged hosts to be
#       registered with metad before a graph space can be used. (Owned by the Topology Service's
#       bootstrap once it is built.)
# -----------------------------------------------------------------------------------------

volumes:
  kafka-data:
  pg-data:
  nebula-meta:
  nebula-storage:

networks:
  cp-net:
    driver: bridge
