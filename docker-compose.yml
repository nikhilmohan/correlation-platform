volumes:
  kafka-data:
  pg-data:
  nebula-meta:
  nebula-storage:
  sim-data:              # Simulator persistent artifacts (ground-truth labels + snapshot + corpus)
  enrichment-overlay:    # Enrichment chatter overlay (operator promotions, durable across restart)

