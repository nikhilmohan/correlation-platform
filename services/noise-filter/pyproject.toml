[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-filter"
version = "0.1.0"
description = "ACP Noise Filter Service — DBSCAN storm-reduction over alarms.enriched + run-stats/observed-chatter read API."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ACP Platform Team" }]
dependencies = [
    # Canonical event model (the frozen contract binding). Installed from the repo
    # path in CI/Docker; declared here so a fresh editable install resolves it.
    "acp-event-model",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "confluent-kafka>=2.3,<3",
    "asyncpg>=0.29,<1",
    "yoyo-migrations>=8.2,<9",
    # yoyo 8.x imports `pkg_resources` at import time; Python 3.13 venvs no longer ship
    # setuptools, and setuptools>=81 dropped `pkg_resources`. Pin <81 so a fresh install
    # keeps `pkg_resources` importable (MIT-licensed).
    "setuptools>=68,<81",
    "prometheus-client>=0.20,<1",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21,<1",
    "ruff>=0.5",
    "black>=24",
    "jsonschema>=4",
    # Integration stage only (Testcontainers Postgres + the real-entrypoint test). All Apache-2.0.
    "testcontainers[postgres]>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the marker AND the yoyo schema migrations as package data so the SQL travels inside the
# wheel/sdist and is resolvable from the installed package (importlib.resources) — works for an
# editable checkout, a non-editable wheel install, and the Docker image alike.
noise_filter = ["py.typed", "migrations/*.sql"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires `Depends(...)` / `Query(...)` as a parameter
# default; B008 (no function calls in argument defaults) is a known false positive there.
"src/noise_filter/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselect integration-tagged Testcontainers tests by default (the unit gate has no Docker);
# run them with `pytest -m integration --run-integration` in the integration stage.
addopts = "--cov=noise_filter --cov-report=term-missing -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: real-PostgreSQL Testcontainers tests (deselected by default; integration stage only)",
]

[tool.coverage.run]
# app.py wiring is now covered by tests (test_app_wiring.py) + the integration entrypoint test;
# only the bare __main__ / asyncio.run shims remain off the gate.
omit = ["src/noise_filter/__main__.py"]
