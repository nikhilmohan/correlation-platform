// pattern-manager — Service build.
//
// Spring Boot 3.x (Java 17). Single owner of the full pattern domain: consumes patterns.mined,
// enriches (RCA + structural validation + codebook reconciliation + session-window derivation +
// XAI), persists to the Pattern Store (PostgreSQL, schema `pattern`, Flyway), drives the
// human-approval lifecycle via its API, and is the sole emitter of PatternDiscoveredEvent /
// PatternApprovedEvent on patterns.discovered / patterns.approved.
//
// All dependencies are permissive (Apache-2.0 / MIT / EPL-2.0 / PostgreSQL):
//   Spring Boot, Spring Kafka, springdoc-openapi, Flyway, PostgreSQL JDBC,
//   networknt/json-schema-validator, micrometer-prometheus, logstash-logback-encoder,
//   Testcontainers, WireMock, JUnit 5. No GPL/AGPL/BSL. No ML libs; no NebulaGraph driver.

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
}

group = 'com.acp'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '2.6.0'
    networkntVersion = '1.4.0'
    logstashEncoderVersion = '7.4'
    testcontainersVersion = '1.20.1'
    wiremockVersion = '3.9.1'
}

dependencies {
    // --- The FROZEN event-model contract (Envelope + Pattern* payloads + sessionWindow) ---
    // Resolved by the composite build declared in settings.gradle (includeBuild). The service
    // binds ONLY to this published binding + the Kafka topic contracts.
    implementation 'com.acp:event-model:0.1.0'

    // --- Spring Boot web + persistence ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Kafka consumer (patterns.mined) + producers (patterns.discovered / patterns.approved) ---
    implementation 'org.springframework.kafka:spring-kafka'

    // --- Persistence: PostgreSQL + Flyway (schema-scoped migrations) ---
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // --- OpenAPI 3.1 (springdoc) ---
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // --- JSON-Schema validation (used by the event-model codec, transitively) ---
    implementation "com.networknt:json-schema-validator:${networkntVersion}"

    // --- Observability: Prometheus registry + structured JSON logs ---
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

    // --- Test: JUnit 5 + Spring + Testcontainers (PostgreSQL, Kafka) + WireMock collaborator stubs ---
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    // H2 (in-memory) lets the full app context boot for the OpenAPI drift gate without a real DB;
    // the true round-trip is covered by the integration-tagged Testcontainers Postgres test.
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        // Integration-tagged tests (real Kafka + real PostgreSQL via Testcontainers) are excluded
        // from the default `build`/CI run per repo convention — they MUST still compile and be
        // runnable via `-DincludeIntegration=true`. The live gate is the catch-net (MEMORY.md).
        if (System.getProperty('includeIntegration') != 'true') {
            excludeTags 'integration'
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    // Propagate the OpenAPI regenerate flag to the test JVM (see generateOpenApi below).
    if (System.getProperty('updateOpenApi') != null) {
        systemProperty 'updateOpenApi', System.getProperty('updateOpenApi')
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
    // Exclude the Spring Boot entrypoint + generated OpenAPI/config plumbing from the measure.
    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    'com/acp/patternmanager/PatternManagerApplication*',
                ])
            })
        )
    }
}

check.dependsOn jacocoTestCoverageVerification

// --- OpenAPI export + drift gate -----------------------------------------------------------
// The running app serves the live document at /openapi.json (springdoc). OpenApiExportTest boots
// the app, fetches that document, and:
//   * on a normal `build`/CI run (updateOpenApi unset) ASSERTS it matches the checked-in
//     services/pattern-manager/openapi.json and FAILS the build on any drift (contract change);
//   * under `generateOpenApi` (updateOpenApi=true) REWRITES the checked-in file.
tasks.register('generateOpenApi', Test) {
    group = 'documentation'
    description = 'Regenerate the checked-in services/pattern-manager/openapi.json from the live document.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.acp.patternmanager.OpenApiExportTest'
    }
    systemProperty 'updateOpenApi', 'true'
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    doLast {
        logger.lifecycle('Regenerated services/pattern-manager/openapi.json — review and commit it.')
    }
}
