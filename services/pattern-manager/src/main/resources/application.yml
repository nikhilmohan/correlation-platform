server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pattern-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/correlation}
    username: ${DB_USER:correlation}
    password: ${DB_PASSWORD:correlation}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: pattern
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: pattern
    default-schema: pattern
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- Actuator: /health + /metrics (Prometheus) at root paths, per platform convention ---
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus,metrics
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true

# --- OpenAPI (springdoc) served at /openapi.json ---
springdoc:
  api-docs:
    path: /openapi.json
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui

# --- Pattern Manager config (all env-overridable; no hard-coded URLs/thresholds) ---
pattern-manager:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:pattern-manager-patterns.mined}
    topics:
      mined: ${PATTERNS_MINED_TOPIC:patterns.mined}
      mined-dlq: ${PATTERNS_MINED_DLQ_TOPIC:patterns.mined.dlq}
      discovered: ${PATTERNS_DISCOVERED_TOPIC:patterns.discovered}
      approved: ${PATTERNS_APPROVED_TOPIC:patterns.approved}
  integration:
    mode: ${INTEGRATION_MODE:real}
    topology:
      base-url: ${TOPOLOGY_BASE_URL:http://topology:8080}
      domain: ${TOPOLOGY_DOMAIN:core-ip}
    codebook:
      base-url: ${CODEBOOK_BASE_URL:http://codebook-api:8000}
      domain: ${CODEBOOK_DOMAIN:core-ip}
    knowledge:
      base-url: ${KNOWLEDGE_BASE_URL:http://knowledge:8080}
      domain: ${KNOWLEDGE_DOMAIN:core-ip}
  session-window:
    # Documented, env-overridable derivation parameters (design "Session-window derivation").
    # NOT Knowledge-sourced business thresholds; NOT hard-coded magic numbers.
    margin-factor: ${SESSION_WINDOW_MARGIN_FACTOR:1.5}
    min-ms: ${SESSION_WINDOW_MIN_MS:5000}
    max-ms: ${SESSION_WINDOW_MAX_MS:1800000}
    gap-floor-factor: ${SESSION_WINDOW_GAP_FLOOR_FACTOR:2.0}
    cv-fixed-threshold: ${SESSION_WINDOW_CV_FIXED_THRESHOLD:0.5}
    # timing-aliases default EMPTY (identity) — the Pattern Miner emits the canonical ms keys.
