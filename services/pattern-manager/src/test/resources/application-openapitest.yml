# Boots the full app context for the OpenAPI drift gate WITHOUT a real Postgres/Kafka.
# The HTTP surface (springdoc) does not touch the DB at startup; the true DB round-trip is covered
# by the integration-tagged Testcontainers test.
spring:
  datasource:
    url: "jdbc:h2:mem:pmopenapi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS pattern"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: pattern
  flyway:
    enabled: false

pattern-manager:
  kafka:
    enabled: false
  seed:
    # The OpenAPI drift gate is a pure HTTP-surface test — keep it hermetic by not running the
    # startup pattern seed loader (the seed's behaviour is covered by PatternSeedLoaderTest and the
    # real-Postgres SeedLoaderIT). Disable it here so this profile boots the context only.
    on-startup: false
