[alembic]
# Dev/CLI convenience only (e.g. `alembic -c alembic.ini revision ...` from the service dir).
# The RUNTIME does NOT read this file: trailbuilder.runtime resolves script_location via
# importlib.resources over the installed package (see runtime.migrations_dir), so migrations are
# found in an editable checkout, a non-editable wheel install, AND the Docker image.
script_location = src/trailbuilder/migrations
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg://correlation:correlation@postgres:5432/correlation

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
