// enrichment — Spring Boot service build.
//
// The frozen event-model Java binding (com.acp:event-model:0.1.0) is consumed as a Gradle
// composite build (includeBuild) so this service depends on the *published binding artifact*
// (its generated AlarmEvent POJO + codec), never on another service's source. The path resolves
// libs/event-model/java relative to this service directory (services/enrichment -> ../../libs/...).
rootProject.name = 'enrichment'

includeBuild '../../libs/event-model/java'
