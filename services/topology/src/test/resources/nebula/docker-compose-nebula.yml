# Minimal single-replica NebulaGraph stack for Testcontainers integration tests
# (metad + storaged + graphd). Apache-2.0 images. Used only by @Tag("integration") tests;
# excluded from the fast `./gradlew build` unit run. The Topology Service itself runs the
# idempotent ADD HOSTS + CREATE SPACE bootstrap against this stack (storaged is registered by
# the bootstrap, not by a healthcheck), so no container healthchecks are defined here — the
# integration base waits on the graphd nGQL port (9669) and then drives the bootstrap.
version: "3.4"
services:
  metad:
    image: vesoft/nebula-metad:v3.8.0
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=metad
      - --ws_ip=metad
      - --port=9559
      - --data_path=/data/meta
    ports:
      - "9559"

  storaged:
    image: vesoft/nebula-storaged:v3.8.0
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=storaged
      - --ws_ip=storaged
      - --port=9779
      - --data_path=/data/storage
    depends_on:
      - metad
    ports:
      - "9779"

  graphd:
    image: vesoft/nebula-graphd:v3.8.0
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
    depends_on:
      - metad
      - storaged
    ports:
      - "9669"
