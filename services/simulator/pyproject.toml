[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulator"
version = "0.1.0"
description = "ACP Alarm Correlation Platform — Simulator (domain-grounded synthetic topology + labeled alarm streams; evaluation oracle)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ACP Platform Team" }]
dependencies = [
    "acp-event-model>=0.1.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "networkx>=3.2,<4",
    "fastapi>=0.110,<1",
    "starlette>=0.36",
    "httpx>=0.27,<1",
    "jsonschema>=4.20,<5",
    "prometheus-client>=0.20,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
# confluent-kafka is the production Kafka client (librdkafka); kept optional so the unit
# suite (which mocks the broker) installs without native build deps.
kafka = ["confluent-kafka>=2.3,<3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "black>=24",
]

[project.scripts]
sim = "simulator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# _vendor/snapshot.schema.json is the build-time-synced verbatim copy of Topology's canonical
# snapshot schema; it MUST be bundled into the wheel/container so snapshot_writer resolves it
# at runtime (importlib.resources) when no source checkout of services/topology is present.
simulator = ["py.typed", "domains/coreip/data/*.yaml", "_vendor/*.json"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=simulator --cov-report=term-missing"

[tool.coverage.run]
omit = [
    # Real network/process boundaries exercised only in integration, not unit tests.
    "src/simulator/integrations/kafka_producer.py",
    "src/simulator/api/server.py",
]
