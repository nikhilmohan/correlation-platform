[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebook-generator"
version = "0.1.0"
description = "ACP Codebook Generator Service — forward-propagation codebook compilation + read API."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ACP Platform Team" }]
dependencies = [
    # Canonical event model (the frozen contract binding). Installed from the repo
    # path in CI/Docker; declared here so a fresh editable install resolves it.
    "acp-event-model",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "networkx>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "pg8000>=1.30,<2",
    "confluent-kafka>=2.3,<3",
    "yoyo-migrations>=8.2,<9",
    # yoyo 8.x imports `pkg_resources` at import time; Python 3.13 venvs no longer ship
    # setuptools, and setuptools>=81 dropped `pkg_resources`. Pin <81 so a fresh install
    # keeps `pkg_resources` importable (MIT-licensed).
    "setuptools>=68,<81",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21,<1",
    "ruff>=0.5",
    "black>=24",
    "jsonschema>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the marker AND the yoyo schema migrations as package data so the SQL travels inside the
# wheel/sdist and is resolvable from the installed package (importlib.resources) — works for an
# editable checkout, a non-editable wheel install, and the Docker image alike.
codebook_generator = ["py.typed", "migrations/*.sql"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires `Depends(...)` as a parameter default;
# B008 (no function calls in argument defaults) is a known false positive there.
"src/codebook_generator/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=codebook_generator --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/codebook_generator/__main__.py"]
