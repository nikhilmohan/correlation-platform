spring:
  application:
    name: correlation-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/acp}
    username: ${DB_USER:acp}
    password: ${DB_PASSWORD:acp}
  flyway:
    enabled: true
    schemas: incident
    default-schema: incident
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Explicit, idempotent, at-least-once: manual dedupe on alarmId/eventId; earliest so no
      # persisted alarm is missed on (re)start; String payloads decoded via the event-model codec.
      group-id: correlation-engine
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      isolation-level: read_committed
    producer:
      # Idempotent producer: acks=all + enable.idempotence so a retried send never duplicates.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      service: correlation-engine

springdoc:
  api-docs:
    path: /openapi.json
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html

correlation:
  # Persistence backing for the Incident Store + event-dedupe ledger. Defaults to jdbc so the real
  # PostgreSQL system-of-record is used whenever the service runs against a database; only the
  # unit/mock profile overrides this to `memory`.
  persistence:
    mode: ${PERSISTENCE_MODE:jdbc}

correlation-engine:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  integration-mode: ${INTEGRATION_MODE:real}
  pattern-manager-base-url: ${PATTERN_MANAGER_BASE_URL:http://pattern-manager:8080}
  codebook-generator-base-url: ${CODEBOOK_GENERATOR_BASE_URL:http://codebook-generator:8080}
  knowledge-base-url: ${KNOWLEDGE_BASE_URL:http://knowledge:8080}
  knowledge-domain: ${KNOWLEDGE_DOMAIN:core-ip}
  knowledge-refresh-ms: ${KNOWLEDGE_REFRESH_MS:60000}
  expiry-tick-ms: ${EXPIRY_TICK_MS:1000}
  rca-eval-mode: ${RCA_EVAL_MODE:off}
  # Trail Builder integration (pattern generalization). mock|real; base URL never hard-coded.
  trail-builder-base-url: ${TRAIL_BUILDER_BASE_URL:http://trail-builder:8080}
  trail-builder-mode: ${TRAIL_BUILDER_MODE:}
  trail-builder-max-retries: ${TRAIL_BUILDER_MAX_RETRIES:2}
  topics:
    alarms-persisted-live: ${TOPIC_ALARMS_PERSISTED_LIVE:alarms.persisted.live}
    patterns-approved: ${TOPIC_PATTERNS_APPROVED:patterns.approved}
    codebook-generated: ${TOPIC_CODEBOOK_GENERATED:codebook.generated}
    trails-built: ${TOPIC_TRAILS_BUILT:trails.built}
    correlation-results: ${TOPIC_CORRELATION_RESULTS:correlation.results}
    alarms-status-changed: ${TOPIC_ALARMS_STATUS_CHANGED:alarms.status.changed}

logging:
  level:
    root: INFO
    com.acp.correlationengine: INFO
