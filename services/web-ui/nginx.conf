# nginx config for the web-ui static SPA. Listens on 8080 (non-privileged port so the
# container can run as a non-root user). Serves the Angular build and falls back to index.html
# for client-side routing (deep links such as /incidents/:id, /topology/:siteId).

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Writable temp paths so the server can run as an unprivileged user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the runtime env overlay or the entry document.
    location = /env.js {
      add_header Cache-Control "no-store";
    }
    location = /index.html {
      add_header Cache-Control "no-store";
    }

    # Hashed assets are immutable.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA client-side routing fallback for deep links.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
