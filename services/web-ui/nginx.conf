# nginx config for the web-ui static SPA + same-origin API reverse proxy.
#
# Listens on 8080 (non-privileged port so the container can run as a non-root user). Serves the
# Angular build and falls back to index.html for client-side routing (deep links such as
# /incidents/:id, /topology/:siteId).
#
# ── WHY THE PROXY (CORS root cause) ───────────────────────────────────────────────────────────
# The SPA runs in the operator's BROWSER. When its base URLs were host-published backend origins
# (http://localhost:8082 …), every data fetch was CROSS-ORIGIN (SPA origin :8086 → backend :8081-
# 8084). The browser then enforces CORS preflight/response checks; the backends emit NO CORS
# headers, so the browser BLOCKS the responses and the SPA cannot load data (curl works because
# curl does not enforce CORS — only the browser does). Fix (human decision): a same-origin reverse
# proxy IN web-ui so the browser only ever talks to ONE origin. No backend service changes.
#
# ── PROXY MAPPING (path-prefix scheme) ────────────────────────────────────────────────────────
# The SPA base URLs are same-origin relative path prefixes (/api/<svc>); its typed clients then
# append the producer's REAL path. nginx strips the /api/<svc> prefix via a trailing-slash
# proxy_pass so the upstream sees its real path. Concretely:
#
#   browser request                         → upstream (docker service:port) sees
#   ────────────────────────────────────────────────────────────────────────────────────────────
#   GET /api/topology/topology/sites        → topology:8080      GET /topology/sites
#   GET /api/topology/actuator/health       → topology:8080      GET /actuator/health
#   GET /api/knowledge/domains/{d}/...       → knowledge:8080     GET /domains/{d}/...
#   GET /api/trail-builder/trails            → trail-builder:8000 GET /trails
#   GET /api/codebook/codebooks/active       → codebook-api:8000  GET /codebooks/active
#
# Each location is a REGEX match that captures the producer-relative suffix (`$1`) after the
# /api/<svc>/ prefix and passes it explicitly to the upstream: `proxy_pass http://$up/$1$is_args$args`.
# That captured-suffix form is REQUIRED here because proxy_pass uses a variable upstream (see
# RESILIENCE below): when proxy_pass contains a variable, nginx does NOT auto-append the request
# URI, so the suffix must be passed explicitly — otherwise the upstream receives an empty path and
# 404/500s. `$is_args$args` preserves the query string (e.g. ?snapshotId=current&domain=core-ip).
#
# ── RESILIENCE (backend down / not-yet-built) ────────────────────────────────────────────────
# Upstreams are addressed THROUGH VARIABLES with a runtime `resolver` (Docker's embedded DNS at
# 127.0.0.11). This defers name resolution to request time, so nginx STARTS even if a backend is
# absent (e.g. the P2/P3 services that are not in the P1 compose yet) — a missing/temporarily-down
# upstream yields a 502/504 at request time rather than a config-load failure at startup.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Writable temp paths so the server can run as an unprivileged user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving upstreams at request time (via the variables below) means
    # an absent/down backend does NOT prevent nginx from starting — it 502/504s per request.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Shared proxy headers for every API location (origin preserved as same-origin to the SPA).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Graceful timeouts so a slow/absent upstream fails fast as 504 rather than hanging.
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── P1 read-API backends (present in the P1 docker-compose) ─────────────────────────────────
    # NOTE: the upstream host is held in a `set` variable so the `resolver` above is used at
    # request time (nginx only does request-time resolution when proxy_pass contains a variable).
    # The `(.*)` capture is the producer-relative suffix; it is passed explicitly (see header note),
    # along with the original query string ($is_args$args). Regex locations are evaluated before the
    # SPA prefix/asset locations below, so /api/* never falls through to the index.html fallback.
    location ~ ^/api/topology/(.*)$ {
      set $upstream_topology "topology:8080";
      proxy_pass http://$upstream_topology/$1$is_args$args;
    }
    location ~ ^/api/knowledge/(.*)$ {
      set $upstream_knowledge "knowledge:8080";
      proxy_pass http://$upstream_knowledge/$1$is_args$args;
    }
    location ~ ^/api/trail-builder/(.*)$ {
      set $upstream_trailbuilder "trail-builder:8000";
      proxy_pass http://$upstream_trailbuilder/$1$is_args$args;
    }
    location ~ ^/api/codebook/(.*)$ {
      set $upstream_codebook "codebook-api:8000";
      proxy_pass http://$upstream_codebook/$1$is_args$args;
    }

    # ── P2/P3 + chatter backends (NOT in the P1 compose yet) ────────────────────────────────────
    # Proxied so the routes are ready the moment those services land. Until then DNS resolution of
    # the service name fails at REQUEST time → 502 (handled by the app's graceful-degrade), and —
    # critically — nginx still STARTS (resolution is deferred by the variable + resolver).
    location ~ ^/api/pattern-manager/(.*)$ {
      set $upstream_patternmanager "pattern-manager:8080";
      proxy_pass http://$upstream_patternmanager/$1$is_args$args;
    }
    location ~ ^/api/correlation-engine/(.*)$ {
      set $upstream_correlationengine "correlation-engine:8080";
      proxy_pass http://$upstream_correlationengine/$1$is_args$args;
    }
    location ~ ^/api/alarm-manager/(.*)$ {
      set $upstream_alarmmanager "alarm-manager:8080";
      proxy_pass http://$upstream_alarmmanager/$1$is_args$args;
    }
    location ~ ^/api/noise-filter/(.*)$ {
      set $upstream_noisefilter "noise-filter:8000";
      proxy_pass http://$upstream_noisefilter/$1$is_args$args;
    }
    location ~ ^/api/enrichment/(.*)$ {
      set $upstream_enrichment "enrichment:8080";
      proxy_pass http://$upstream_enrichment/$1$is_args$args;
    }

    # ── CACHING (fingerprinted vs stable-path assets) ──────────────────────────────────────────────
    # The cache policy splits on WHETHER the URL changes when the asset's CONTENT changes:
    #   • Angular emits its JS/CSS bundles with a CONTENT HASH in the filename (main.<hash>.js,
    #     styles.<hash>.css, chunk-<hash>.js). The URL changes on every content change, so these are
    #     safe to cache `immutable` for a year — a returning browser only fetches a bundle whose URL
    #     it has never seen.
    #   • NON-fingerprinted assets live at STABLE paths whose URL does NOT change when their content
    #     does: /icons/*.svg (the Lucide type icons), /geo/*.json (basemap/site geojson), /env.js,
    #     favicon. If these were cached `immutable`, a rebuild with NEW icon SVGs would be MASKED — a
    #     returning browser would keep serving the OLD icons from cache and never re-fetch (the bug
    #     this split fixes). They are served `no-cache` instead: the browser MAY cache them but MUST
    #     REVALIDATE against the origin every time. nginx already emits ETag/Last-Modified, so an
    #     UNCHANGED asset costs one cheap 304 (not a full re-download) and a CHANGED one is re-fetched.
    #     (no-cache, NOT no-store: we still allow caching, we just force revalidation.)
    #   • index.html / env.js are `no-store` (never cached) so the entry doc + runtime env always load
    #     fresh and pull the current fingerprinted bundle references.
    #
    # IMPORTANT (nginx add_header inheritance): an add_header in a nested location REPLACES, not
    # merges with, parent add_headers — so each location sets its own Cache-Control explicitly.
    #
    # Ordering matters: more-specific locations (exact /env.js, prefix /icons//geo/) come BEFORE the
    # generic fingerprinted-bundle regex and the SPA fallback. Worked examples:
    #   GET /                  → no-store     (SPA fallback → index.html, below)
    #   GET /index.html        → no-store
    #   GET /env.js            → no-store
    #   GET /icons/router.svg  → no-cache     (stable path → revalidate, get new SVG after rebuild)
    #   GET /geo/sites.json    → no-cache
    #   GET /chunk-4J6X6RZH.js → immutable    (dash + 8 uppercase-alnum content hash in filename)
    #   GET /styles-5WENKN2J.css → immutable

    # Never cache the entry document or the runtime env overlay (stable paths, content changes often).
    location = /env.js {
      add_header Cache-Control "no-store";
    }
    location = /index.html {
      add_header Cache-Control "no-store";
    }

    # NON-fingerprinted assets at STABLE paths — revalidate so content changes (e.g. new icon SVGs)
    # are picked up without a hard refresh. nginx ETag/Last-Modified make the unchanged case a 304.
    location /icons/ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }
    location /geo/ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }
    location = /favicon.ico {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # FINGERPRINTED Angular bundles ONLY — Angular/esbuild emits a content hash AFTER A DASH as 8
    # uppercase base36 chars (e.g. main-XXXXXXXX.js, chunk-4J6X6RZH.js, styles-5WENKN2J.css,
    # polyfills-XXXXXXXX.js) — NOT `.<lowercasehex>.` after a dot. The URL changes whenever the
    # content does, so these are immutable for a year. Non-hashed .js/.css fall through to the
    # no-cache rule below. Quoted because of the {8} brace quantifier.
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Any OTHER static asset at a stable path (non-hashed js/css, svg/png/jpg/gif/woff at a stable
    # URL) — revalidate rather than cache-forever, so a content change is never masked.
    location ~* "\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$" {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # SPA client-side routing fallback for deep links.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
